  - id: incremental-pdf-text-cache
    scope: [pdf_cache.py, pdf, .pdf-cache, text-extraction, source-access, performance]
    kind: decision
    status: verified
    summary: Root-level pdf_cache.py maintains the content-addressed PDF text cache; agents must use cached text and metadata for every source PDF and may call PDF tools directly only to verify a PDF they created or updated in the current task.
    rationale: Centralized extraction reduces repeated tool calls while filesystem metadata keeps refreshes fast. Restricting direct PDF inspection to current-task output verification preserves visual QA without bypassing the source cache.
    evidence:
      - pdf_cache.py
      - .gitignore
      - README.md#pdf-text-cache
      - AGENTS.md#pdf-source-access
      - command: python -B pdf_cache.py (second run reported up to date in approximately 118 ms for the current repository)
      - command: isolated two-PDF touch test (one fast reuse, one hash, zero re-extractions)
    updated: 2026-09-15
    history:
      - date: 2026-09-15
        prior_status: verified
        prior_summary: Root-level pdf_cache.py maintains a Git-ignored, content-addressed text cache for every nonsymlink PDF below the repository; unchanged files bypass hashing through path, size, mtime_ns, and ctime_ns checks, while changed files alone are hashed and newly seen content alone is extracted.
        reason: Repository-wide instructions now make the cache mandatory for source PDFs and reserve direct PDF tools for verification of PDFs created or changed by the current agent.
        evidence:
          - AGENTS.md#pdf-source-access
          - pdf_cache.py
    relations:
      supersedes: []
      superseded_by: []
