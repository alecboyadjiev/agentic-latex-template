    summary: Standalone analysis reports are Markdown files under the repository-root reports/ directory and are never placed in paper/reports/ or inserted into manuscript files.
    rationale: Separating agent-facing reports from manuscript sources prevents analytical artifacts and report-only build requirements from affecting the paper while retaining review output in a predictable location.
